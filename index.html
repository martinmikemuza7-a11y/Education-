    <script>
      // Gracefully neutralize Vite HMR WebSocket connection in AI Studio preview iframe where HMR is disabled
      (function() {
        var OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            var isViteHmr = protoStr.indexOf('vite-hmr') !== -1 || urlStr.indexOf('vite-hmr') !== -1 || urlStr.indexOf(':24678') !== -1;
            if (isViteHmr) {
              var noop = function() {};
              return {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                readyState: 1, // WebSocket.OPEN
                url: urlStr,
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                addEventListener: noop,
                removeEventListener: noop,
                dispatchEvent: function() { return false; },
                send: noop,
                close: noop
              };
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING;
          window.WebSocket.OPEN = OrigWS.OPEN;
          window.WebSocket.CLOSING = OrigWS.CLOSING;
          window.WebSocket.CLOSED = OrigWS.CLOSED;
        }

        // Intercept console.error to filter out harmless Vite HMR WebSocket notices
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) {
            return (a && a.message) ? a.message : String(a);
          }).join(' ');
          if (joined.indexOf('WebSocket') !== -1 || joined.indexOf('[vite]') !== -1 || joined.indexOf('vite-hmr') !== -1) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (
            event &&
            event.message &&
            (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('[vite]') !== -1)
          ) {
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event &&
            event.reason &&
            (String(event.reason).indexOf('WebSocket') !== -1 || String(event.reason).indexOf('[vite]') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        });
      })();
    </script>
